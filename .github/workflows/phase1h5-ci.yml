name: Phase 1H.5 CI

on:
  push:
    branches:
      - phase-1h5-inventory-lifecycle
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run vercel-build
