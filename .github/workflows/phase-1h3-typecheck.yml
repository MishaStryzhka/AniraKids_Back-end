name: Phase 1H.3 Typecheck Diagnostic

on:
  push:
    branches:
      - phase-1h3-admin-api-foundation

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
