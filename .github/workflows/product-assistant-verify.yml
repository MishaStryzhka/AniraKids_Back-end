name: Product Assistant Verify
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/v2/**'
      - 'scripts/check-product-assistant.js'
      - '.github/workflows/product-assistant-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run vercel-build
      - name: Install disposable MongoDB
        run: |
          curl --fail --silent --show-error --location --retry 3 https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.14.tgz -o "$RUNNER_TEMP/mongodb.tgz"
          echo "b4cf8caae108785135ecc8b86ad8ed6df5d6efb84b9b95a50ecba2fc246ce084  $RUNNER_TEMP/mongodb.tgz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/mongodb.tgz" -C "$RUNNER_TEMP"
      - name: Draft, media, AI and concurrent creation integration
        env:
          NODE_ENV: test
          ASSISTANT_MONGOD_BINARY: ${{ runner.temp }}/mongodb-linux-x86_64-ubuntu2204-7.0.14/bin/mongod
        run: node scripts/check-product-assistant.js
