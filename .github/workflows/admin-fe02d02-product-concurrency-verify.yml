name: ADMIN-FE-02D-02 Product Concurrency

on:
  pull_request:
    branches: [main]
    paths:
      - src/v2/services/catalogue-admin.service.ts
      - src/v2/services/catalogue-admin.types.ts
      - src/v2/http/admin-error-mapper.ts
      - scripts/check-v2-admin-api.js
      - scripts/check-v2-product-concurrency-integration.js
      - package.json
      - .github/workflows/admin-fe02d02-product-concurrency-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify exact HEAD and approved file boundary
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor be34ce6e0822f5c25a9f9d2c5f940edbe2a1cb72 HEAD
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const base = 'be34ce6e0822f5c25a9f9d2c5f940edbe2a1cb72';
          const allowed = new Set([
            'src/v2/services/catalogue-admin.service.ts',
            'src/v2/services/catalogue-admin.types.ts',
            'src/v2/http/admin-error-mapper.ts',
            'scripts/check-v2-admin-api.js',
            'scripts/check-v2-product-concurrency-integration.js',
            'package.json',
            '.github/workflows/admin-fe02d02-product-concurrency-verify.yml',
          ]);
          const files = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], {encoding:'utf8'}).trim().split('\n');
          assert.ok(files.every(file => allowed.has(file)), 'Unexpected file outside approved scope');
          const originalPackage = JSON.parse(execFileSync('git', ['show', `${base}:package.json`], {encoding:'utf8'}));
          const nextPackage = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(nextPackage.scripts['check:v2-product-concurrency:integration'],
            'npm run build:v2 && node scripts/check-v2-product-concurrency-integration.js');
          delete nextPackage.scripts['check:v2-product-concurrency:integration'];
          assert.deepEqual(nextPackage, originalPackage, 'Only focused npm command may change');
          const path = 'src/v2/services/catalogue-admin.service.ts';
          const original = execFileSync('git', ['show', `${base}:${path}`], {encoding:'utf8'});
          const current = fs.readFileSync(path, 'utf8');
          const section = (text, start, end) => text.slice(text.indexOf(start), text.indexOf(end));
          for (const [start, end] of [
            ['export class CatalogueAdminService', '  async updateProduct('],
            ['  async createVariant(', '  async activateProduct('],
          ]) assert.equal(section(current, start, end), section(original, start, end));
          console.log(`EXACT_HEAD=${process.env.EXPECTED_HEAD}`);
          console.log('SCOPE_GUARD=PASS; create/list/detail/variants/inventory/media/schema unchanged');
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Initialize verification evidence directory
        run: echo "PRODUCT_CONCURRENCY_EVIDENCE_DIR=$RUNNER_TEMP/product-concurrency-evidence" >> "$GITHUB_ENV"
      - name: TypeScript, build and existing pure regressions
        run: |
          mkdir -p "$PRODUCT_CONCURRENCY_EVIDENCE_DIR"
          npm run vercel-build 2>&1 | tee "$PRODUCT_CONCURRENCY_EVIDENCE_DIR/build-and-regressions.log"
      - name: Install pinned MongoDB binary (no service or external database)
        run: |
          curl --fail --silent --show-error --location --retry 3 https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.14.tgz -o "$RUNNER_TEMP/mongodb.tgz"
          echo "b4cf8caae108785135ecc8b86ad8ed6df5d6efb84b9b95a50ecba2fc246ce084  $RUNNER_TEMP/mongodb.tgz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/mongodb.tgz" -C "$RUNNER_TEMP"
      - name: Barrier-controlled real Mongo suite and negative guards
        env:
          NODE_ENV: test
          PRODUCT_CONCURRENCY_TEST_ALLOW: '1'
          PRODUCT_CONCURRENCY_MONGOD_BINARY: ${{ runner.temp }}/mongodb-linux-x86_64-ubuntu2204-7.0.14/bin/mongod
        run: |
          # Harness generates the exact anirakids_cas_test_<32 lowercase hex>
          # DB name (<64 bytes), loopback port, canonical URI and disposable process.
          # No application URI, secrets, .env, shared DB or provider network.
          npm run check:v2-product-concurrency:integration 2>&1 | tee "$PRODUCT_CONCURRENCY_EVIDENCE_DIR/integration.log"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-concurrency-${{ env.EXPECTED_HEAD }}
          path: ${{ env.PRODUCT_CONCURRENCY_EVIDENCE_DIR }}
          if-no-files-found: error
